# Remote deployment needs kexec and raw writes to the system disk without a
# prompt, so the deployment helper is granted on its own and without one.
permit nopass laserbridge as root cmd /usr/sbin/laserbridge-deploy

# The operator also gets a general root path, because a headless appliance
# with no console is otherwise impossible to diagnose: no dmesg, no mount, no
# way to look at a failing service.
#
# Without a password, deliberately. An appliance set up with an SSH key has no
# account password its owner knows, so asking for one would put root out of
# reach of exactly the person who needs it. This gives up part of the
# hardening in ADR 0002: whoever can log in as laserbridge is root. On this
# appliance that is nearly true already - the web interface has no login at
# all - and being able to investigate the device beats defending it from its
# owner. See ADR 0008.
permit nopass laserbridge as root
