# USB autosuspend is off before anything can ask for it to be on.
#
# This says the same thing as usbcore.autosuspend=-1 on the kernel command
# line, and it exists because that command line cannot be changed by an
# update: it is baked into the GRUB image on the ESP, which is written at
# install time and never touched again. An appliance updated in place keeps
# whatever it was installed with. The root filesystem, and therefore this
# file, is replaced by every update (ADR 0015, ADR 0017).
#
# A module option only applies when the module is loaded, so this file is also
# carried into the initramfs - usbcore may already be loaded by the time the
# root filesystem appears, while the driver that matters here, the USB serial
# adapter's, is loaded afterwards by the coldplug in the sysinit runlevel and
# reads this copy.
#
# It is a default and not the setting. system.usb_autosuspend is what the
# appliance actually applies, once /data is readable - including on an
# appliance that deliberately turns autosuspend back on.
options usbcore autosuspend=-1
