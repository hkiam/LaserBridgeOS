# The kernel log stays readable. Restricting it would only inconvenience the
# one account that can log in, which can become root anyway (ADR 0008), while
# dmesg is the first thing anyone needs when a headless appliance misbehaves.
kernel.dmesg_restrict = 0
kernel.kptr_restrict = 2

# A headless appliance has nobody to read an oops off a screen and nobody to
# power-cycle it. Rebooting ten seconds after a panic is the only useful
# response, and treating an oops as a panic is what gets most lockups there in
# the first place - a kernel limping on after one is a kernel whose next
# surprise arrives while a laser is running.
#
# These are sysctls rather than kernel command line arguments deliberately.
# The command line lives in the GRUB image on the ESP, which is written at
# install time and never by an update; this file is in the root filesystem,
# which every update replaces. Boot policy that has to be changeable belongs
# where updates can reach it (ADR 0017).
kernel.panic = 10
kernel.panic_on_oops = 1
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
