# The kernel log stays readable. Restricting it would only inconvenience the
# one account that can log in, which can become root anyway (ADR 0008), while
# dmesg is the first thing anyone needs when a headless appliance misbehaves.
kernel.dmesg_restrict = 0
kernel.kptr_restrict = 2
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
