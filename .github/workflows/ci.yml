name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.mod
      - name: Unit and API tests
        working-directory: backend
        run: go test ./...
      - name: Go vet
        working-directory: backend
        run: go vet ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
      - name: Headless boot policy
        run: sh scripts/check-boot-policy.sh

  image:
    needs: [test, shellcheck]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build raw appliance image
        run: |
          VERSION=0.1.0
          case "$GITHUB_REF" in refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;; esac
          make image VERSION="$VERSION"
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaserBridgeOS-x86_64
          path: |
            dist/LaserBridgeOS-x86_64.img.gz
            dist/*.lbu
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LaserBridgeOS-x86_64.img.gz
            dist/*.lbu
            dist/SHA256SUMS
