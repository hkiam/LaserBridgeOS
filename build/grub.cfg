insmod part_gpt
insmod fat
insmod squash4
insmod loadenv
search --no-floppy --label --set=esp LBBOOT

set laserbridge_slot=a
if [ -f ($esp)/boot/active-slot.cfg ]; then
    source ($esp)/boot/active-slot.cfg
fi

# Boot-attempt counter. This appliance is headless with no console login, so a
# system slot that never reaches userspace cannot be recovered by hand. GRUB
# raises the counter before every boot and laserbridge-boot-confirm resets it
# once the default runlevel is up; three unconfirmed attempts in a row select
# the other slot instead. The override survives in grubenv so the fallback
# keeps applying until userspace confirms it and rewrites active-slot.cfg.
set laserbridge_try=0
set laserbridge_override=
if [ -f ($esp)/boot/grubenv ]; then
    load_env -f ($esp)/boot/grubenv laserbridge_try laserbridge_override
fi
if [ "$laserbridge_override" = "a" -o "$laserbridge_override" = "b" ]; then
    set laserbridge_slot=$laserbridge_override
fi

# GRUB script has no arithmetic, so the counter advances through explicit cases.
if [ "$laserbridge_try" = "2" ]; then
    if [ "$laserbridge_slot" = "b" ]; then
        set laserbridge_slot=a
    else
        set laserbridge_slot=b
    fi
    set laserbridge_try=0
    set laserbridge_override=$laserbridge_slot
elif [ "$laserbridge_try" = "1" ]; then
    set laserbridge_try=2
else
    set laserbridge_try=1
fi
save_env -f ($esp)/boot/grubenv laserbridge_try laserbridge_override

# usbcore.autosuspend=-1 keeps the kernel from suspending idle USB devices, and
# it is set here rather than only in userspace because devices are probed long
# before /data is mounted: the serial adapter and the camera would otherwise
# spend the first seconds of every boot under a policy nobody chose. An
# appliance that allows autosuspend on purpose has system.usb_autosuspend say
# so, and laserbridge applies it over this one once the configuration is
# readable.
if [ "$laserbridge_slot" = "b" ]; then
    linux ($esp)/boot/slot-b/vmlinuz-lts root=LASERBRIDGE_ROOT_B laserbridge.slot=b rootfstype=squashfs ro rootwait quiet loglevel=3 usbcore.autosuspend=-1
    initrd ($esp)/boot/slot-b/initramfs-lts
else
    linux ($esp)/boot/slot-a/vmlinuz-lts root=LASERBRIDGE_ROOT_A laserbridge.slot=a rootfstype=squashfs ro rootwait quiet loglevel=3 usbcore.autosuspend=-1
    initrd ($esp)/boot/slot-a/initramfs-lts
fi
boot
