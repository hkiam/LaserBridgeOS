insmod part_gpt
insmod fat
insmod squash4
search --no-floppy --label --set=esp LBBOOT

set laserbridge_slot=a
if [ -f ($esp)/boot/active-slot.cfg ]; then
    source ($esp)/boot/active-slot.cfg
fi

if [ "$laserbridge_slot" = "b" ]; then
    linux ($esp)/boot/slot-b/vmlinuz-lts root=LASERBRIDGE_ROOT_B laserbridge.slot=b rootfstype=squashfs ro rootwait quiet loglevel=3
    initrd ($esp)/boot/slot-b/initramfs-lts
else
    linux ($esp)/boot/slot-a/vmlinuz-lts root=LASERBRIDGE_ROOT_A laserbridge.slot=a rootfstype=squashfs ro rootwait quiet loglevel=3
    initrd ($esp)/boot/slot-a/initramfs-lts
fi
boot
